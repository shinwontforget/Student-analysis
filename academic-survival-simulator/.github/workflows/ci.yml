name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  frontend:
    name: Frontend CI (Lint, Typecheck, Test, Audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit & Security Tests
        run: npm test

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true # Non-blocking on low/moderate transitive warnings if clean

  backend:
    name: Backend CI (Pytest & Pip-Audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ./backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit httpx

      - name: Run Pytest Test Suite
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET || 'test_internal_secret_ci_123' }}
        run: pytest

      - name: Run Pip Security Audit
        run: pip-audit
        continue-on-error: true # Prevents pipeline breakage on unpatched upstream package advisories
